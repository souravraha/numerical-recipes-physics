[workspace]
authors = ["Sourav Raha <19655241+souravraha@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "numerical-recipes-physics"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.10.*"
numpy = ">=1.26,<3"
scipy = ">=1.11,<2"
pytest = ">=8,<9"
matplotlib = ">=3.7,<4"

[tasks]
test = { cmd = "pytest -q", env = { PYTHONPATH = "src" } }
examples = { cmd = "bash examples/run_examples.sh", env = { PYTHONPATH = "src" } }
