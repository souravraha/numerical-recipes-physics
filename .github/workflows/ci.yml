name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # C port: build + run every test, with warnings treated as errors.
  c:
    name: C (make test, -Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make -C c test CFLAGS="-std=c11 -O2 -Wall -Wextra -Werror -Iinclude"

  # C port: run every test under AddressSanitizer + UndefinedBehaviorSanitizer
  # to catch memory errors and UB in the from-scratch algorithms.
  c-sanitize:
    name: C (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run every test under ASan + UBSan
        working-directory: c
        run: |
          set -euo pipefail
          for t in tests/test_*.c; do
            name="$(basename "$t" .c)"
            bin="/tmp/asan_${name}"
            cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
               -Wall -Wextra -Iinclude "$t" src/*.c -o "$bin" -lm
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 "$bin"
            rm -f "$bin"
          done

  # Python package: install deps and run the verification-first suite.
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest
      - name: Test
        run: pytest -q
